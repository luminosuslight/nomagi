# localhost inside the container is not the Docker host; reach host services via host.docker.internal.
map $git_host $git_upstream_host {
    default $git_host;
    "~^localhost(:[0-9]+)?$" host.docker.internal$1;
    "~^127\.0\.0\.1(:[0-9]+)?$" host.docker.internal$1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # isomorphic-git: corsProxy + "/" + scheme + "/" + url without scheme
    # → /git-cors/(http|https)/<host>/…  (legacy /git-cors/<host>/… defaults to HTTPS)
    resolver 127.0.0.11 1.1.1.1 valid=30s ipv6=off;

    location ~ ^/git-cors/(?<git_scheme>http|https)/(?<git_host>[^/]+)(?<git_path>/.*)?$ {
        client_max_body_size 50m;
        proxy_pass $git_scheme://$git_upstream_host$git_path$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host $git_host;
        proxy_set_header Accept-Encoding "";
    }

    location ~ ^/git-cors/(?<git_host>[^/]+)(?<git_path>/.*)?$ {
        client_max_body_size 50m;
        proxy_pass https://$git_upstream_host$git_path$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host $git_host;
        proxy_set_header Accept-Encoding "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
