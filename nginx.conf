server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # isomorphic-git: corsProxy + "/" + url without scheme → /git-cors/<host>/…
    resolver 127.0.0.11 1.1.1.1 valid=30s ipv6=off;

    location ~ ^/git-cors/(?<git_host>[^/]+)(?<git_path>/.*)?$ {
        # Git push packs (notes + inline SVG sketches); nginx default is 1m.
        client_max_body_size 50m;
        proxy_pass https://$git_host$git_path$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host $git_host;
        proxy_set_header Accept-Encoding "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
