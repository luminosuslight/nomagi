services:
  gitea:
    image: gitea/gitea:1.23.8
    container_name: gitea
    restart: unless-stopped
    environment:
      USER_UID: ${GITEA_UID:-1000}
      USER_GID: ${GITEA_GID:-1000}
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:-localhost}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-http://localhost:55001/}
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__LFS_START_SERVER: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      # Git smart HTTP CORS (isomorphic-git in the browser)
      GITEA__repository__ACCESS_CONTROL_ALLOW_ORIGIN: ${GITEA_CORS_ORIGIN:-https://notes.luminosus.org}
      GITEA__cors__ENABLED: "true"
      GITEA__cors__ALLOW_DOMAIN: ${GITEA_CORS_ALLOW_DOMAIN:-https://notes.luminosus.org,https://notes-dev.luminosus.org}
      GITEA__cors__METHODS: GET,HEAD,POST,OPTIONS
      GITEA__cors__ALLOW_CREDENTIALS: "false"
      GITEA__cors__HEADERS: Authorization,Content-Type,User-Agent,Git-Protocol,Accept
    ports:
      - "${GITEA_HTTP_PORT:-55001}:3000"
    volumes:
      - gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

volumes:
  gitea-data:
